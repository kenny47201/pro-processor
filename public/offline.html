<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Process Tools Offline</title>
    <style>
      :root { color-scheme: dark; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #020617; color: #e2e8f0; }
      main { max-width: 620px; padding: 32px; }
      .card { border: 1px solid #1e293b; border-radius: 18px; background: #0f172a; padding: 28px; box-shadow: 0 24px 80px rgba(0,0,0,.35); }
      h1 { margin: 0 0 12px; font-size: 28px; }
      p { color: #94a3b8; line-height: 1.55; }
      a { color: #38bdf8; }
    </style>
  </head>
  <body>
    <main>
      <section class="card">
        <h1>Process Tools are offline</h1>
        <p>
          The installed app is available offline after the main tools screen has loaded and cached once.
          Reconnect briefly, open <a href="/tools">Process Tools</a>, then launch the installed app again.
        </p>
      </section>
    </main>
  </body>
</html>
